<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>骰子对战</title>
<style>
  :root {
    --bg: #14181f;
    --panel: #1e2530;
    --panel-2: #262e3c;
    --text: #e8ecf3;
    --muted: #8b96a8;
    --accent: #4f9dff;
    --danger: #ff5b6e;
    --good: #3ddc84;
    --gold: #ffc94d;
    --border: #323c4d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #243047 0%, var(--bg) 55%) fixed;
    color: var(--text);
    min-height: 100vh;
  }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 14px 14px 32px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    letter-spacing: 1px;
  }
  header h1 .dice { color: var(--gold); }
  .header-btns { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    padding: 9px 12px;
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .icon-btn:active { transform: scale(0.96); }

  .level-tag {
    text-align: center;
    font-size: 13px;
    color: var(--gold);
    margin: 0 0 12px;
    letter-spacing: 1px;
    font-weight: 600;
  }

  /* 状态栏 */
  .status {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    padding: 8px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .status.player { color: var(--accent); }
  .status.monster { color: var(--danger); }
  .status.win { color: var(--good); }
  .status.lose { color: var(--danger); }

  /* 对战场 */
  .arena {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .vs { font-weight: 800; color: var(--muted); font-size: 15px; }

  .combatant {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 12px;
    text-align: center;
    transition: box-shadow 0.3s ease;
  }
  .combatant .avatar { font-size: 34px; line-height: 1; margin-bottom: 6px; }
  .combatant .name {
    font-weight: 700;
    margin-bottom: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hpbar {
    height: 12px;
    background: #0e1218;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 6px;
    border: 1px solid var(--border);
  }
  .hpfill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    transition: width 0.45s ease, background 0.45s ease;
  }
  .hpfill.good { background: var(--good); }
  .hpfill.mid { background: var(--gold); }
  .hpfill.bad { background: var(--danger); }
  .hp-text { font-size: 12px; color: var(--muted); }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .combatant.hit .avatar { animation: hitflash 0.4s ease; }
  @keyframes hitflash {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-3px); }
    100% { transform: translateX(0); }
  }

  /* 骰子区 */
  .section-title {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 8px 2px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .dice-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 54px;
    margin-bottom: 14px;
    justify-content: center;
  }
  .die {
    width: 52px;
    height: 64px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    position: relative;
    transition: transform 0.1s ease;
  }
  .die .label { font-size: 11px; font-weight: 700; opacity: 0.85; }
  .die .value { font-size: 22px; font-weight: 800; line-height: 1.1; }
  .die.rolling { animation: shake 0.3s infinite; }
  @keyframes shake {
    0% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-3px) rotate(-3deg); }
    50% { transform: translateY(0) rotate(0); }
    75% { transform: translateY(-3px) rotate(3deg); }
    100% { transform: translateY(0) rotate(0); }
  }
  .die.d4  { background: #3a2a12; border-color: #ff9f2e; color: #ffb75c; }
  .die.d6  { background: #15273f; border-color: #4f9dff; color: #7db8ff; }
  .die.d12 { background: #12301f; border-color: #3ddc84; color: #6ce7a4; }
  .die.d20 { background: #33162c; border-color: #c66bff; color: #d99aff; }

  /* 特效：掷出最大点数 */
  .die.max {
    box-shadow: 0 0 0 2px var(--gold), 0 0 20px 5px rgba(255, 201, 77, 0.65);
    animation: maxpop 0.55s ease;
  }
  @keyframes maxpop {
    0% { transform: scale(1); }
    40% { transform: scale(1.28) rotate(-5deg); }
    70% { transform: scale(0.94); }
    100% { transform: scale(1); }
  }
  .die.max::after {
    content: "★";
    position: absolute;
    top: -10px;
    right: -8px;
    font-size: 16px;
    color: var(--gold);
    text-shadow: 0 0 9px rgba(255, 201, 77, 0.95);
    animation: starshine 0.5s ease;
  }
  @keyframes starshine {
    0% { transform: scale(0) rotate(-120deg); }
    70% { transform: scale(1.5) rotate(20deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* 特效：全屏反馈（JS 驱动 opacity，避免移动端 CSS animation 被节流） */
  .fx-flash {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
    background: radial-gradient(circle at 50% 40%, rgba(255, 245, 200, 1) 0%, rgba(255, 200, 90, 0.85) 30%, rgba(255, 130, 60, 0.35) 55%, rgba(255, 120, 60, 0) 75%);
    opacity: 0;
    transition: opacity 0.15s ease-out;
    will-change: opacity;
  }
  .fx-text {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 101;
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #fff8e0;
    text-shadow: 0 0 10px #ffb020, 0 0 22px #ff9a2e, 0 0 42px #ff7a1e, 0 3px 6px rgba(0, 0, 0, 0.75);
    opacity: 0;
    text-align: center;
    padding: 0 20px;
    will-change: transform, opacity;
  }

  .roll-btn {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    background: linear-gradient(180deg, #5aa9ff, #3c86e0);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(79,157,255,0.3);
    letter-spacing: 1px;
  }
  .roll-btn:active { transform: translateY(1px); }
  .roll-btn:disabled {
    background: var(--panel-2);
    color: var(--muted);
    box-shadow: none;
    cursor: not-allowed;
  }

  /* 日志 */
  .log {
    margin-top: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
  }
  .log .section-title { margin-bottom: 6px; }
  .log-list {
    max-height: 180px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .log-item { color: var(--text); }
  .log-item.muted { color: var(--muted); }
  .log-item.dmg { color: var(--gold); }
  .log-item.hit { color: var(--danger); }
  .log-item.hero { color: var(--good); }

  /* 弹窗 */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal.open { display: flex; }
  .modal-content {
    background: var(--panel);
    width: 100%;
    max-width: 560px;
    border-radius: 20px 20px 0 0;
    padding: 18px 18px 24px;
    max-height: 88vh;
    overflow-y: auto;
    animation: slideup 0.25s ease;
  }
  @keyframes slideup { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-content h2 { margin: 0 0 14px; font-size: 17px; }

  .field-group {
    margin-bottom: 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    background: var(--panel-2);
  }
  .field-group h3 { margin: 0 0 10px; font-size: 13px; color: var(--accent); letter-spacing: 1px; }
  .field {
    display: grid;
    grid-template-columns: 1fr 110px;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .field:last-child { margin-bottom: 0; }
  .field label { font-size: 14px; color: var(--text); }
  .field input {
    width: 100%;
    background: #0e1218;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 9px 10px;
    font-size: 15px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }

  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }

  /* 奖励三选一 */
  .reward-tip { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .reward-grid { display: flex; flex-direction: column; gap: 10px; }
  .reward-card {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    cursor: pointer;
    text-align: left;
  }
  .reward-card:active { transform: scale(0.98); border-color: var(--accent); }
  .reward-card .ico { font-size: 26px; line-height: 1; }
  .reward-card .txt { font-size: 15px; font-weight: 700; }
  .reward-card .desc { font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .reward-card.full .txt { color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🎲 <span class="dice">骰子对战</span></h1>
    <div class="header-btns">
      <button class="icon-btn" id="restartBtn">🔄 重开</button>
      <button class="icon-btn" id="configToggle">⚙ 设置</button>
    </div>
  </header>
  <div class="level-tag" id="levelTag">第 1 关</div>

  <div class="status player" id="status">你的回合</div>

  <div class="arena">
    <div class="combatant" id="monsterPanel">
      <div class="avatar" id="monsterAvatar">�</div>
      <div class="name" id="monsterName">怪物</div>
      <div class="hpbar"><div class="hpfill good" id="monsterHpFill"></div></div>
      <div class="hp-text" id="monsterHpText">HP 0/0</div>
      <div class="sub" id="monsterAtk">攻击 0</div>
    </div>

    <div class="vs">VS</div>

    <div class="combatant" id="playerPanel">
      <div class="avatar">🧙</div>
      <div class="name" id="playerName">玩家</div>
      <div class="hpbar"><div class="hpfill good" id="playerHpFill"></div></div>
      <div class="hp-text" id="playerHpText">HP 0/0</div>
      <div class="sub" id="playerDiceInfo">骰子 0 颗</div>
    </div>
  </div>

  <p class="section-title">你的骰子</p>
  <div class="dice-pool" id="dicePool"></div>

  <button class="roll-btn" id="rollBtn">🎲 投掷骰子</button>

  <div class="log">
    <p class="section-title">战斗日志</p>
    <div class="log-list" id="log"></div>
  </div>
</div>

<div class="modal" id="configModal">
  <div class="modal-content">
    <h2>初始属性设置</h2>
    <p class="reward-tip" style="margin:-6px 0 12px;">用于开始全新一局，怪物会随关卡变强。</p>

    <div class="field-group">
      <h3>玩家初始属性</h3>
      <div class="field"><label>名字</label><input id="pName" type="text" value="玩家"></div>
      <div class="field"><label>生命值</label><input id="pHp" type="number" min="1" value="100"></div>
      <div class="field"><label>暴击率 (%)</label><input id="pCrit" type="number" min="0" max="100" value="50"></div>
      <div class="field"><label>四面骰 (D4) 数量</label><input id="pD4" type="number" min="0" value="0"></div>
      <div class="field"><label>六面骰 (D6) 数量</label><input id="pD6" type="number" min="0" value="2"></div>
      <div class="field"><label>十二面骰 (D12) 数量</label><input id="pD12" type="number" min="0" value="0"></div>
      <div class="field"><label>二十面骰 (D20) 数量</label><input id="pD20" type="number" min="0" value="1"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-ghost" id="cancelBtn">取消</button>
      <button class="btn-primary" id="applyBtn">开始新游戏</button>
    </div>
  </div>
</div>

<div class="modal" id="rewardModal">
  <div class="modal-content">
    <h2 id="rewardTitle">🏆 胜利！</h2>
    <div id="rewardBody"></div>
  </div>
</div>

<div class="fx-flash" id="fxFlash"></div>
<div class="fx-text" id="fxText"></div>

<script>
(function () {
  "use strict";

  // ------- 配置（新游戏初始值） -------
  const config = {
    player: { name: "玩家", hp: 100, critRate: 0.5, dice: { 4: 0, 6: 2, 12: 0, 20: 1 } }
  };

  // ------- 怪物关卡序列 -------
  const MONSTERS = [
    { name: "史莱姆",   emoji: "🟢", hp: 30,  attack: 6 },
    { name: "哥布林",   emoji: "👺", hp: 42,  attack: 8 },
    { name: "野狼",     emoji: "🐺", hp: 55,  attack: 10 },
    { name: "骷髅兵",   emoji: "💀", hp: 70,  attack: 12 },
    { name: "石魔像",   emoji: "🗿", hp: 88,  attack: 14 },
    { name: "暗影刺客", emoji: "🌑", hp: 108, attack: 16 },
    { name: "火焰法师", emoji: "🔥", hp: 130, attack: 18 },
    { name: "冰霜巨人", emoji: "❄️", hp: 155, attack: 20 },
    { name: "暗黑骑士", emoji: "⚔️", hp: 185, attack: 22 },
    { name: "远古巨龙", emoji: "🐉", hp: 220, attack: 24 }
  ];
  const CRIT_CAP = 0.6;          // 暴击率上限 60%
  const DICE_UPGRADE = [4, 6, 12, 20];

  // ------- 运行时状态 -------
  let state = null;
  let playerTurn = true;
  let busy = false;

  // DOM
  const $ = (id) => document.getElementById(id);
  const el = {
    status: $("status"), levelTag: $("levelTag"),
    monsterAvatar: $("monsterAvatar"), monsterName: $("monsterName"), monsterHpFill: $("monsterHpFill"), monsterHpText: $("monsterHpText"), monsterAtk: $("monsterAtk"),
    playerName: $("playerName"), playerHpFill: $("playerHpFill"), playerHpText: $("playerHpText"), playerDiceInfo: $("playerDiceInfo"),
    dicePool: $("dicePool"), rollBtn: $("rollBtn"), log: $("log"),
    configToggle: $("configToggle"), restartBtn: $("restartBtn"), configModal: $("configModal"),
    cancelBtn: $("cancelBtn"), applyBtn: $("applyBtn"),
    rewardModal: $("rewardModal"), rewardTitle: $("rewardTitle"), rewardBody: $("rewardBody"),
    monsterPanel: $("monsterPanel"), playerPanel: $("playerPanel")
  };

  // ------- 音效引擎（Web Audio，免外部文件） -------
  let audioCtx = null;
  function ensureAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
  }
  function tone(freq, dur, type, vol, when) {
    if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(Math.max(0.0001, vol), when);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(when); o.stop(when + dur);
    } catch (e) {}
  }
  function playSound(name) {
    ensureAudio();
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    if (name === "roll") { tone(320 + Math.random() * 200, 0.08, "square", 0.06, t); }
    else if (name === "crit") { tone(220, 0.4, "triangle", 0.2, t); tone(880, 0.3, "sawtooth", 0.16, t); tone(1320, 0.25, "square", 0.1, t + 0.04); }
    else if (name === "max") { tone(1600, 0.16, "sine", 0.13, t); tone(2400, 0.1, "sine", 0.08, t + 0.05); }
    else if (name === "hit") { tone(180, 0.18, "square", 0.13, t); }
    else if (name === "win") { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, "triangle", 0.14, t + i * 0.12)); }
    else if (name === "lose") { [400, 300, 200].forEach((f, i) => tone(f, 0.28, "sawtooth", 0.1, t + i * 0.16)); }
  }

  // ------- 工具 -------
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function critPct() { return Math.round(state.player.critRate * 100); }
  function log(msg, cls) {
    const div = document.createElement("div");
    div.className = "log-item" + (cls ? " " + cls : "");
    div.textContent = msg;
    el.log.appendChild(div);
    el.log.scrollTop = el.log.scrollHeight;
  }
  function triggerCrit(text) {
    playSound("crit");
    const flash = $("fxFlash");
    const txt = $("fxText");
    const app = document.querySelector(".app");

    txt.textContent = text;
    txt.style.transition = "none";
    txt.style.opacity = "0";
    txt.style.transform = "scale(0.3)";
    void txt.offsetWidth;
    txt.style.transition = "opacity 0.16s ease-out, transform 0.32s cubic-bezier(.2,.8,.2,1)";
    txt.style.opacity = "1";
    txt.style.transform = "scale(1.12)";

    flash.style.transition = "none";
    flash.style.opacity = "0";
    void flash.offsetWidth;
    flash.style.transition = "opacity 0.18s ease-out";
    flash.style.opacity = "1";

    shakeApp(app);

    clearTimeout(txt._hideTimer);
    txt._hideTimer = setTimeout(function () {
      txt.style.transition = "opacity 0.22s ease-out, transform 0.22s ease-out";
      txt.style.opacity = "0";
      txt.style.transform = "scale(1.4)";
    }, 900);
    clearTimeout(flash._hideTimer);
    flash._hideTimer = setTimeout(function () {
      flash.style.transition = "opacity 0.3s ease-out";
      flash.style.opacity = "0";
    }, 450);
  }
  function shakeApp(app) {
    if (app._shaking) return;
    app._shaking = true;
    const start = Date.now();
    const dur = 420;
    function step() {
      const p = (Date.now() - start) / dur;
      if (p >= 1) { app.style.transform = "translate(0,0)"; app._shaking = false; return; }
      const amp = 7 * (1 - p);
      app.style.transform = "translate(" + ((Math.random() * 2 - 1) * amp) + "px," + ((Math.random() * 2 - 1) * amp) + "px)";
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function hitFlash(panel) {
    panel.classList.remove("hit");
    void panel.offsetWidth;
    panel.classList.add("hit");
  }
  function hpColor(pct) {
    if (pct > 0.5) return "good";
    if (pct > 0.25) return "mid";
    return "bad";
  }
  function setStatus(text, cls) { el.status.textContent = text; el.status.className = "status " + cls; }
  function renderHP(side) {
    const s = state[side];
    const pct = Math.max(0, Math.min(1, s.hp / s.maxHp));
    const fill = side === "player" ? el.playerHpFill : el.monsterHpFill;
    const text = side === "player" ? el.playerHpText : el.monsterHpText;
    fill.style.width = (pct * 100) + "%";
    fill.className = "hpfill " + hpColor(pct);
    text.textContent = "HP " + Math.max(0, s.hp) + "/" + s.maxHp;
  }
  function renderAll() {
    el.levelTag.textContent = "第 " + (state.level + 1) + " 关 / 共 " + MONSTERS.length + " 关";
    el.monsterAvatar.textContent = state.monster.emoji;
    el.monsterName.textContent = state.monster.name;
    el.playerName.textContent = state.player.name;
    el.monsterAtk.textContent = "攻击 " + state.monster.attack;
    el.playerDiceInfo.textContent = "骰子 " + state.dicePool.length + " 颗 · 暴击 " + critPct() + "%";
    renderHP("monster");
    renderHP("player");
    buildDicePool();
  }
  function buildDicePool() {
    el.dicePool.innerHTML = "";
    state.dicePool.sort((a, b) => a.faces - b.faces);
    state.dicePool.forEach((d, idx) => {
      const die = document.createElement("div");
      die.className = "die d" + d.faces;
      die.dataset.idx = String(idx);
      die.innerHTML = '<div class="label">D' + d.faces + '</div><div class="value">?</div>';
      el.dicePool.appendChild(die);
    });
  }
  function dieEls() { return el.dicePool.querySelectorAll(".die"); }

  // ------- 关卡 / 战斗流程 -------
  function loadLevel(levelIndex) {
    state.level = levelIndex;
    state.monster = Object.assign({}, MONSTERS[levelIndex], { maxHp: MONSTERS[levelIndex].hp });
    state.player.hp = state.player.maxHp;          // 进入新关回满血
    playerTurn = true;
    busy = false;
    el.log.innerHTML = "";
    renderAll();
    updateTurnUI();
    log("第 " + (levelIndex + 1) + " 关：你遭遇了 " + state.monster.name + "！", "muted");
    log("暴击率 " + critPct() + "%：暴击时额外再掷一轮全部骰子。", "muted");
  }

  function restartGame() {
    state = {
      level: 0,
      player: { name: config.player.name, hp: config.player.hp, maxHp: config.player.hp, critRate: config.player.critRate },
      dicePool: [],
      monster: null
    };
    const d = config.player.dice;
    DICE_UPGRADE.forEach((faces) => {
      for (let i = 0; i < (d[faces] || 0); i++) state.dicePool.push({ faces: Number(faces) });
    });
    el.rewardModal.classList.remove("open");
    loadLevel(0);
  }

  function updateTurnUI() {
    if (busy || !state) return;
    const ended = state.player.hp <= 0 || state.monster.hp <= 0;
    if (ended) return;
    if (playerTurn) {
      setStatus("你的回合", "player");
      el.rollBtn.disabled = false;
      el.rollBtn.textContent = "🎲 投掷骰子";
    } else {
      setStatus("怪物回合", "monster");
      el.rollBtn.disabled = true;
      el.rollBtn.textContent = "等待怪物行动…";
    }
  }

  function roll() {
    if (busy || !playerTurn || !state) return;
    if (state.dicePool.length === 0) { log("你没有骰子可以投掷。", "hit"); return; }

    busy = true;
    playerTurn = false;
    el.rollBtn.disabled = true;
    playSound("roll");
    const dice = state.dicePool;

    const r1 = dice.map((d) => randInt(1, d.faces));
    const els = dieEls();

    els.forEach((e) => e.classList.remove("max"));
    els.forEach((e) => e.classList.add("rolling"));
    let ticks = 0;
    const timer = setInterval(() => {
      els.forEach((e) => {
        const faces = dice[Number(e.dataset.idx)].faces;
        e.querySelector(".value").textContent = String(randInt(1, faces));
      });
      ticks++;
      if (ticks >= 12) {
        clearInterval(timer);
        let anyMax = false;
        els.forEach((e, i) => {
          e.classList.remove("rolling");
          e.querySelector(".value").textContent = String(r1[i]);
          if (r1[i] === dice[i].faces) { e.classList.add("max"); anyMax = true; }
        });
        if (anyMax) playSound("max");
        const crit = Math.random() < state.player.critRate;
        if (crit) rollRound2(r1); else finishRoll(r1, null);
      }
    }, 55);
  }

  function rollRound2(r1) {
    triggerCrit("暴击！");
    log("暴击！额外再掷一轮全部骰子！", "dmg");
    const dice = state.dicePool;
    const els = dieEls();
    const r2 = dice.map((d) => randInt(1, d.faces));

    els.forEach((e) => e.classList.remove("max"));
    els.forEach((e) => e.classList.add("rolling"));
    let ticks = 0;
    const timer = setInterval(() => {
      els.forEach((e) => {
        const i = Number(e.dataset.idx);
        const faces = dice[i].faces;
        e.querySelector(".value").textContent = String(r1[i] + randInt(1, faces));
      });
      ticks++;
      if (ticks >= 12) {
        clearInterval(timer);
        let anyMax = false;
        els.forEach((e, i) => {
          e.classList.remove("rolling");
          e.querySelector(".value").textContent = String(r1[i] + r2[i]);
          if (r2[i] === dice[i].faces) { e.classList.add("max"); anyMax = true; }
        });
        if (anyMax) playSound("max");
        finishRoll(r1, r2);
      }
    }, 55);
  }

  function finishRoll(r1, r2) {
    const dice = state.dicePool;
    let total;
    if (r2) {
      const s1 = r1.reduce((a, b) => a + b, 0);
      const s2 = r2.reduce((a, b) => a + b, 0);
      total = s1 + s2;
      log("第一轮 " + s1 + "，第二轮 " + s2 + "，合计 " + total + "。", "muted");
    } else {
      total = r1.reduce((a, b) => a + b, 0);
      const detail = dice.map((d, i) => "D" + d.faces + "=" + r1[i]).join("  ");
      log("你投掷了 " + dice.length + " 颗骰子：" + detail, "muted");
    }
    log("你对 " + state.monster.name + " 造成 " + total + " 点伤害！", "dmg");

    state.monster.hp -= total;
    playSound("hit");
    hitFlash(el.monsterPanel);
    renderHP("monster");

    if (state.monster.hp <= 0) {
      state.monster.hp = 0;
      renderHP("monster");
      endBattle(true);
      return;
    }
    setStatus("怪物回合", "monster");
    setTimeout(monsterAttack, 900);
  }

  function monsterAttack() {
    const dmg = state.monster.attack;
    log(state.monster.name + " 对你造成 " + dmg + " 点伤害！", "hit");
    state.player.hp -= dmg;
    playSound("hit");
    hitFlash(el.playerPanel);
    renderHP("player");
    if (state.player.hp <= 0) {
      state.player.hp = 0;
      renderHP("player");
      endBattle(false);
      return;
    }
    playerTurn = true;
    busy = false;
    updateTurnUI();
  }

  function endBattle(win) {
    busy = true;
    playerTurn = false;
    el.rollBtn.disabled = true;
    if (win) {
      playSound("win");
      setStatus("🏆 胜利！", "win");
      el.rollBtn.textContent = "你击败了 " + state.monster.name;
      log("🏆 你击败了 " + state.monster.name + "，获得胜利！", "hero");
      setTimeout(showReward, 700);
    } else {
      playSound("lose");
      setStatus("💀 战败…", "lose");
      el.rollBtn.textContent = "🔄 重新开始";
      log("💀 你被 " + state.monster.name + " 击败了……", "hit");
      el.rollBtn.disabled = false;
    }
  }

  // ------- 胜利结算 / 成长 / 掉落 -------
  function showReward() {
    const isFinal = state.level >= MONSTERS.length - 1;
    el.rewardTitle.textContent = isFinal ? "🎉 恭喜通关！" : "🏆 第 " + (state.level + 1) + " 关通关！";
    el.rewardBody.innerHTML = "";

    if (isFinal) {
      const tip = document.createElement("p");
      tip.className = "reward-tip";
      tip.textContent = "你击败了所有 " + MONSTERS.length + " 个敌人，完成了整场冒险！";
      el.rewardBody.appendChild(tip);
      const btn = document.createElement("button");
      btn.className = "btn-primary";
      btn.style.width = "100%";
      btn.style.padding = "13px";
      btn.style.borderRadius = "12px";
      btn.style.fontSize = "15px";
      btn.style.fontWeight = "700";
      btn.style.border = "none";
      btn.style.cursor = "pointer";
      btn.textContent = "🔄 重新开始";
      btn.onclick = restartGame;
      el.rewardBody.appendChild(btn);
    } else {
      const tip = document.createElement("p");
      tip.className = "reward-tip";
      tip.textContent = "选择一项成长奖励：";
      el.rewardBody.appendChild(tip);

      const grid = document.createElement("div");
      grid.className = "reward-grid";
      const rewards = [
        { ico: "❤️", txt: "生命上限 +20", desc: "当前生命也会回满", key: "hp", full: false },
        { ico: "💥", txt: "暴击率 +6%", desc: "上限 60%", key: "crit", full: state.player.critRate >= CRIT_CAP },
        { ico: "🎲", txt: "骰子升级", desc: "最低面数骰子提升一级", key: "dice", full: false }
      ];
      rewards.forEach((r) => {
        const card = document.createElement("button");
        card.className = "reward-card" + (r.full ? " full" : "");
        const ico = document.createElement("span");
        ico.className = "ico";
        ico.textContent = r.ico;
        const txtWrap = document.createElement("span");
        txtWrap.innerHTML = '<span class="txt">' + r.txt + '</span><br><span class="desc">' + r.desc + (r.full ? "（已达上限）" : "") + '</span>';
        card.appendChild(ico);
        card.appendChild(txtWrap);
        if (!r.full) card.onclick = function () { applyReward(r.key); };
        grid.appendChild(card);
      });
      el.rewardBody.appendChild(grid);
    }
    el.rewardModal.classList.add("open");
  }

  function applyReward(key) {
    if (key === "hp") {
      state.player.maxHp += 20;
      state.player.hp = state.player.maxHp;
      log("成长：生命上限 +20。", "hero");
    } else if (key === "crit") {
      state.player.critRate = Math.min(CRIT_CAP, state.player.critRate + 0.06);
      log("成长：暴击率 +6%（现 " + critPct() + "%）。", "hero");
    } else if (key === "dice") {
      const sorted = state.dicePool.slice().sort((a, b) => a.faces - b.faces);
      const min = sorted[0];
      const idx = DICE_UPGRADE.indexOf(min.faces);
      if (idx < DICE_UPGRADE.length - 1) {
        min.faces = DICE_UPGRADE[idx + 1];
        log("成长：一颗 D" + DICE_UPGRADE[idx] + " 升级为 D" + min.faces + "。", "hero");
      } else {
        state.dicePool.push({ faces: 20 });
        log("成长：获得一颗新的 D20！", "hero");
      }
    }
    el.rewardModal.classList.remove("open");
    loadLevel(state.level + 1);
  }

  // ------- 设置面板 -------
  function openModal() {
    $("pName").value = config.player.name;
    $("pHp").value = config.player.hp;
    $("pCrit").value = Math.round(config.player.critRate * 100);
    $("pD4").value = config.player.dice[4];
    $("pD6").value = config.player.dice[6];
    $("pD12").value = config.player.dice[12];
    $("pD20").value = config.player.dice[20];
    el.configModal.classList.add("open");
  }
  function closeModal() { el.configModal.classList.remove("open"); }

  function applyConfig() {
    const pName = $("pName").value.trim() || "玩家";
    const pHp = parseInt($("pHp").value, 10);
    const crit = parseInt($("pCrit").value, 10);
    const d4 = parseInt($("pD4").value, 10);
    const d6 = parseInt($("pD6").value, 10);
    const d12 = parseInt($("pD12").value, 10);
    const d20 = parseInt($("pD20").value, 10);

    if (!(pHp > 0)) { alert("玩家生命值需大于 0"); return; }
    if (!(crit >= 0 && crit <= 100)) { alert("暴击率需在 0~100 之间（游戏中成长上限 60%）"); return; }
    const totalDice = [d4, d6, d12, d20].reduce((a, b) => a + (Number.isFinite(b) ? b : 0), 0);
    if (totalDice <= 0) { alert("至少需要一颗骰子"); return; }

    config.player = { name: pName, hp: pHp, critRate: Math.min(CRIT_CAP, crit / 100), dice: { 4: d4, 6: d6, 12: d12, 20: d20 } };
    closeModal();
    restartGame();
  }

  // ------- 事件 -------
  el.rollBtn.addEventListener("click", function () {
    if (state && state.player.hp <= 0) { restartGame(); return; }
    roll();
  });
  el.configToggle.addEventListener("click", openModal);
  el.restartBtn.addEventListener("click", function () {
    if (confirm("确定重新开始？当前进度会清空。")) restartGame();
  });
  el.cancelBtn.addEventListener("click", closeModal);
  el.applyBtn.addEventListener("click", applyConfig);
  el.configModal.addEventListener("click", (e) => { if (e.target === el.configModal) closeModal(); });

  // ------- 启动 -------
  restartGame();
})();
</script>
</body>
</html>
