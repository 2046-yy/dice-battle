<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>骰子对战 · 爬塔</title>
<style>
  :root {
    --bg: #14181f;
    --panel: #1e2530;
    --panel-2: #262e3c;
    --text: #e8ecf3;
    --muted: #8b96a8;
    --accent: #4f9dff;
    --danger: #ff5b6e;
    --good: #3ddc84;
    --gold: #ffc94d;
    --border: #323c4d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #243047 0%, var(--bg) 55%) fixed;
    color: var(--text);
    min-height: 100vh;
  }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 14px 14px 32px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    letter-spacing: 1px;
  }
  header h1 .dice { color: var(--gold); }
  .header-btns { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    padding: 9px 12px;
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .icon-btn:active { transform: scale(0.96); }

  /* 战况状态栏（地图视图） */
  .run-info {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .run-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
  }
  .run-chip b { color: var(--gold); font-weight: 700; }

  /* 地图 */
  .map-wrap {
    position: relative;
    background: linear-gradient(180deg, #1a2230 0%, #14181f 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .map-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .map-node {
    position: absolute;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    border: 2px solid var(--border);
    background: #232b38;
    cursor: pointer;
    transform: translate(-50%, -50%);
    z-index: 2;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  }
  .map-node.locked { opacity: 0.35; cursor: default; filter: grayscale(0.6); }
  .map-node.reachable {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(255, 201, 77, 0.25), 0 0 14px rgba(255, 201, 77, 0.5);
    animation: nodepulse 1.6s ease-in-out infinite;
  }
  @keyframes nodepulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.12); }
  }
  .map-node.current {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 157, 255, 0.35), 0 0 16px rgba(79, 157, 255, 0.6);
  }
  .map-node.type-battle { background: #18263d; }
  .map-node.type-elite { background: #331824; border-color: #b9486d; }
  .map-node.type-event { background: #2d2413; }
  .map-node.type-rest { background: #14301f; }
  .map-node.type-shop { background: #332c12; }
  .map-node.type-chest { background: #331e12; }
  .map-node.type-boss { background: #3a1220; border-color: var(--danger); width: 60px; height: 60px; font-size: 30px; }
  .map-node.type-start { background: #1c2a3f; border-color: var(--accent); }
  .map-tip {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .level-tag {
    text-align: center;
    font-size: 13px;
    color: var(--gold);
    margin: 0 0 12px;
    letter-spacing: 1px;
    font-weight: 600;
  }

  /* 状态栏 */
  .status {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    padding: 8px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .status.player { color: var(--accent); }
  .status.monster { color: var(--danger); }
  .status.win { color: var(--good); }
  .status.lose { color: var(--danger); }

  /* 对战场 */
  .arena {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .vs { font-weight: 800; color: var(--muted); font-size: 15px; }

  .combatant {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 12px;
    text-align: center;
    transition: box-shadow 0.3s ease;
  }
  .combatant .avatar { font-size: 34px; line-height: 1; margin-bottom: 6px; }
  .combatant .name {
    font-weight: 700;
    margin-bottom: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hpbar {
    height: 12px;
    background: #0e1218;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 6px;
    border: 1px solid var(--border);
  }
  .hpfill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    transition: width 0.45s ease, background 0.45s ease;
  }
  .hpfill.good { background: var(--good); }
  .hpfill.mid { background: var(--gold); }
  .hpfill.bad { background: var(--danger); }
  .hp-text { font-size: 12px; color: var(--muted); }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .combatant.hit .avatar { animation: hitflash 0.4s ease; }
  @keyframes hitflash {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-3px); }
    100% { transform: translateX(0); }
  }

  /* 骰子区 */
  .section-title {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 8px 2px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .dice-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 54px;
    margin-bottom: 14px;
    justify-content: center;
  }
  .die {
    width: 52px;
    height: 64px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    position: relative;
    transition: transform 0.1s ease;
  }
  .die .label { font-size: 11px; font-weight: 700; opacity: 0.85; }
  .die .value { font-size: 22px; font-weight: 800; line-height: 1.1; }
  .die.rolling { animation: shake 0.3s infinite; }
  @keyframes shake {
    0% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-3px) rotate(-3deg); }
    50% { transform: translateY(0) rotate(0); }
    75% { transform: translateY(-3px) rotate(3deg); }
    100% { transform: translateY(0) rotate(0); }
  }
  .die.d4  { background: #3a2a12; border-color: #ff9f2e; color: #ffb75c; }
  .die.d6  { background: #15273f; border-color: #4f9dff; color: #7db8ff; }
  .die.d12 { background: #12301f; border-color: #3ddc84; color: #6ce7a4; }
  .die.d20 { background: #33162c; border-color: #c66bff; color: #d99aff; }

  /* 特效：掷出最大点数 */
  .die.max {
    box-shadow: 0 0 0 2px var(--gold), 0 0 20px 5px rgba(255, 201, 77, 0.65);
    animation: maxpop 0.55s ease;
  }
  @keyframes maxpop {
    0% { transform: scale(1); }
    40% { transform: scale(1.28) rotate(-5deg); }
    70% { transform: scale(0.94); }
    100% { transform: scale(1); }
  }
  .die.max::after {
    content: "★";
    position: absolute;
    top: -10px;
    right: -8px;
    font-size: 16px;
    color: var(--gold);
    text-shadow: 0 0 9px rgba(255, 201, 77, 0.95);
    animation: starshine 0.5s ease;
  }
  @keyframes starshine {
    0% { transform: scale(0) rotate(-120deg); }
    70% { transform: scale(1.5) rotate(20deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* 特效：全屏反馈（JS 驱动 opacity，避免移动端 CSS animation 被节流） */
  .fx-flash {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
    background: radial-gradient(circle at 50% 40%, rgba(255, 245, 200, 1) 0%, rgba(255, 200, 90, 0.85) 30%, rgba(255, 130, 60, 0.35) 55%, rgba(255, 120, 60, 0) 75%);
    opacity: 0;
    transition: opacity 0.15s ease-out;
    will-change: opacity;
  }
  .fx-text {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 101;
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #fff8e0;
    text-shadow: 0 0 10px #ffb020, 0 0 22px #ff9a2e, 0 0 42px #ff7a1e, 0 3px 6px rgba(0, 0, 0, 0.75);
    opacity: 0;
    text-align: center;
    padding: 0 20px;
    will-change: transform, opacity;
  }

  .roll-btn {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    background: linear-gradient(180deg, #5aa9ff, #3c86e0);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(79,157,255,0.3);
    letter-spacing: 1px;
  }
  .roll-btn:active { transform: translateY(1px); }
  .roll-btn:disabled {
    background: var(--panel-2);
    color: var(--muted);
    box-shadow: none;
    cursor: not-allowed;
  }
  .trinket-btn {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    border: 1px solid var(--gold);
    border-radius: 12px;
    background: #2d2413;
    color: var(--gold);
    cursor: pointer;
  }
  .trinket-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* 日志 */
  .log {
    margin-top: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
  }
  .log .section-title { margin-bottom: 6px; }
  .log-list {
    max-height: 180px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .log-item { color: var(--text); }
  .log-item.muted { color: var(--muted); }
  .log-item.dmg { color: var(--gold); }
  .log-item.hit { color: var(--danger); }
  .log-item.hero { color: var(--good); }

  /* 弹窗 */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal.open { display: flex; }
  .modal-content {
    background: var(--panel);
    width: 100%;
    max-width: 560px;
    border-radius: 20px 20px 0 0;
    padding: 18px 18px 24px;
    max-height: 88vh;
    overflow-y: auto;
    animation: slideup 0.25s ease;
  }
  @keyframes slideup { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-content h2 { margin: 0 0 14px; font-size: 17px; }

  .field-group {
    margin-bottom: 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    background: var(--panel-2);
  }
  .field-group h3 { margin: 0 0 10px; font-size: 13px; color: var(--accent); letter-spacing: 1px; }
  .field {
    display: grid;
    grid-template-columns: 1fr 110px;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .field:last-child { margin-bottom: 0; }
  .field label { font-size: 14px; color: var(--text); }
  .field input {
    width: 100%;
    background: #0e1218;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 9px 10px;
    font-size: 15px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }

  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }

  .reward-tip { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .reward-grid { display: flex; flex-direction: column; gap: 10px; }
  .reward-card {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    cursor: pointer;
    text-align: left;
  }
  .reward-card:active { transform: scale(0.98); border-color: var(--accent); }
  .reward-card .ico { font-size: 26px; line-height: 1; }
  .reward-card .txt { font-size: 15px; font-weight: 700; }
  .reward-card .desc { font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .reward-card.full .txt { color: var(--muted); }
  .shop-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 13px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
  }
  .shop-item .ico { font-size: 24px; }
  .shop-item .info { flex: 1; }
  .shop-item .info .nm { font-size: 14px; font-weight: 700; }
  .shop-item .info .ds { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .buy-btn {
    padding: 9px 14px;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    cursor: pointer;
    background: var(--gold);
    color: #3a2a12;
    white-space: nowrap;
  }
  .buy-btn:disabled { background: var(--panel-2); color: var(--muted); cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🎲 <span class="dice">骰子爬塔</span></h1>
    <div class="header-btns">
      <button class="icon-btn" id="restartBtn">🔄 重开</button>
      <button class="icon-btn" id="configToggle">⚙ 设置</button>
    </div>
  </header>

  <!-- 地图视图 -->
  <div id="mapView">
    <div class="run-info" id="runInfo"></div>
    <div class="map-wrap" id="mapWrap">
      <svg class="map-svg" id="mapSvg" preserveAspectRatio="none"></svg>
    </div>
    <p class="map-tip">✦ 点击高亮节点，规划你的爬塔路线 ✦</p>
  </div>

  <!-- 战斗视图 -->
  <div id="battleView" style="display:none">
    <div class="level-tag" id="levelTag"></div>
    <div class="status player" id="status">你的回合</div>

    <div class="arena">
      <div class="combatant" id="monsterPanel">
        <div class="avatar" id="monsterAvatar">👾</div>
        <div class="name" id="monsterName">怪物</div>
        <div class="hpbar"><div class="hpfill good" id="monsterHpFill"></div></div>
        <div class="hp-text" id="monsterHpText">HP 0/0</div>
        <div class="sub" id="monsterAtk">攻击 0</div>
      </div>

      <div class="vs">VS</div>

      <div class="combatant" id="playerPanel">
        <div class="avatar">🧙</div>
        <div class="name" id="playerName">玩家</div>
        <div class="hpbar"><div class="hpfill good" id="playerHpFill"></div></div>
        <div class="hp-text" id="playerHpText">HP 0/0</div>
        <div class="sub" id="playerDiceInfo">骰子 0 颗</div>
      </div>
    </div>

    <p class="section-title">你的骰子</p>
    <div class="dice-pool" id="dicePool"></div>

    <button class="roll-btn" id="rollBtn">🎲 投掷骰子</button>
    <button class="trinket-btn" id="trinketBtn" style="display:none">📿 使用饰品</button>

    <div class="log">
      <p class="section-title">战斗日志</p>
      <div class="log-list" id="log"></div>
    </div>
  </div>
</div>

<div class="modal" id="configModal">
  <div class="modal-content">
    <h2>初始属性设置</h2>
    <p class="reward-tip" style="margin:-6px 0 12px;">用于开始全新一局，敌人会随爬塔变强。</p>

    <div class="field-group">
      <h3>玩家初始属性</h3>
      <div class="field"><label>名字</label><input id="pName" type="text" value="玩家"></div>
      <div class="field"><label>生命值</label><input id="pHp" type="number" min="1" value="100"></div>
      <div class="field"><label>暴击率 (%)</label><input id="pCrit" type="number" min="0" max="100" value="50"></div>
      <div class="field"><label>初始金币</label><input id="pGold" type="number" min="0" value="15"></div>
      <div class="field"><label>四面骰 (D4) 数量</label><input id="pD4" type="number" min="0" value="0"></div>
      <div class="field"><label>六面骰 (D6) 数量</label><input id="pD6" type="number" min="0" value="2"></div>
      <div class="field"><label>十二面骰 (D12) 数量</label><input id="pD12" type="number" min="0" value="0"></div>
      <div class="field"><label>二十面骰 (D20) 数量</label><input id="pD20" type="number" min="0" value="1"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-ghost" id="cancelBtn">取消</button>
      <button class="btn-primary" id="applyBtn">开始新游戏</button>
    </div>
  </div>
</div>

<div class="modal" id="nodeModal">
  <div class="modal-content">
    <h2 id="nodeModalTitle">标题</h2>
    <div id="nodeModalBody"></div>
  </div>
</div>

<div class="fx-flash" id="fxFlash"></div>
<div class="fx-text" id="fxText"></div>

<script>
(function () {
  "use strict";

  // ------- 配置（新游戏初始值） -------
  const config = {
    player: { name: "玩家", hp: 100, critRate: 0.5, gold: 15, dice: { 4: 0, 6: 2, 12: 0, 20: 1 } }
  };

  // ------- 地图参数 -------
  const ROWS = 6;          // 6 行：起点 + 4 层可选 + Boss
  const SLOTS = 4;         // 每层 4 个列槽位
  const ROW_GAP = 84, TOP_PAD = 24, BOTTOM_PAD = 16, NODE_SIZE = 52;
  const MAP_H = TOP_PAD + (ROWS - 1) * ROW_GAP + NODE_SIZE + BOTTOM_PAD;

  const CRIT_CAP = 0.6;    // 暴击率上限 60%
  const DICE_UPGRADE = [4, 6, 12, 20];

  // ------- 怪物池（普通战斗，按层难度取用） -------
  const MONSTER_BASE = [
    { name: "史莱姆",   emoji: "🟢", hp: 30,  attack: 6 },
    { name: "哥布林",   emoji: "👺", hp: 42,  attack: 8 },
    { name: "野狼",     emoji: "🐺", hp: 55,  attack: 10 },
    { name: "骷髅兵",   emoji: "💀", hp: 70,  attack: 12 },
    { name: "石魔像",   emoji: "🗿", hp: 88,  attack: 14 },
    { name: "暗影刺客", emoji: "🌑", hp: 108, attack: 16 },
    { name: "火焰法师", emoji: "🔥", hp: 130, attack: 18 },
    { name: "冰霜巨人", emoji: "❄️", hp: 155, attack: 20 },
    { name: "暗黑骑士", emoji: "⚔️", hp: 185, attack: 22 }
  ];
  const BATTLE_POOL = [
    ["史莱姆", "哥布林"],
    ["野狼", "骷髅兵"],
    ["石魔像", "暗影刺客"],
    ["火焰法师", "冰霜巨人"],
    ["暗黑骑士"]
  ];
  const BOSS = { name: "远古巨龙", emoji: "🐉", hp: 220, attack: 24 };

  // ------- 遗物池（被动成长主力 · 节点池待补充） -------
  const RELICS = [

  // ------- 音效引擎（Web Audio，免外部文件） -------
  let audioCtx = null;
  function ensureAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
  }
  function tone(freq, dur, type, vol, when) {
    if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(Math.max(0.0001, vol), when);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(when); o.stop(when + dur);
    } catch (e) {}
  }
  function playSound(name) {
    ensureAudio();
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    if (name === "roll") { tone(320 + Math.random() * 200, 0.08, "square", 0.06, t); }
    else if (name === "crit") { tone(220, 0.4, "triangle", 0.2, t); tone(880, 0.3, "sawtooth", 0.16, t); tone(1320, 0.25, "square", 0.1, t + 0.04); }
    else if (name === "max") { tone(1600, 0.16, "sine", 0.13, t); tone(2400, 0.1, "sine", 0.08, t + 0.05); }
    else if (name === "hit") { tone(180, 0.18, "square", 0.13, t); }
    else if (name === "win") { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, "triangle", 0.14, t + i * 0.12)); }
    else if (name === "lose") { [400, 300, 200].forEach((f, i) => tone(f, 0.28, "sawtooth", 0.1, t + i * 0.16)); }
  }

  // ------- 工具 -------
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
  function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function critPct() { return Math.round(state.player.critRate * 100); }

  function triggerCrit(text) {

    txt.style.opacity = "1";
    txt.style.transform = "scale(1.12)";

    flash.style.transition = "none";
    flash.style.opacity = "0";
    void flash.offsetWidth;
    flash.style.transition = "opacity 0.18s ease-out";
    flash.style.opacity = "1";

    shakeApp(app);

    clearTimeout(txt._hideTimer);
    txt._hideTimer = setTimeout(function () {
      txt.style.transition = "opacity 0.22s ease-out, transform 0.22s ease-out";
      txt.style.opacity = "0";
      txt.style.transform = "scale(1.4)";
    }, 900);
    clearTimeout(flash._hideTimer);
    flash._hideTimer = setTimeout(function () {
      flash.style.transition = "opacity 0.3s ease-out";
      flash.style.opacity = "0";
    }, 450);
  }
  function shakeApp(app) {
    if (app._shaking) return;
    app._shaking = true;
    const start = Date.now();
    const dur = 420;
    function step() {
      const p = (Date.now() - start) / dur;
      if (p >= 1) { app.style.transform = "translate(0,0)"; app._shaking = false; return; }
      const amp = 7 * (1 - p);
      app.style.transform = "translate(" + ((Math.random() * 2 - 1) * amp) + "px," + ((Math.random() * 2 - 1) * amp) + "px)";
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function hitFlash(panel) {

  function renderHP(side) {

  // ------- 地图生成（杀戮尖塔式分层有向无环，保证可达无孤立） -------
  function sampleCols(count) {
    const slots = [];
    for (let i = 0; i < SLOTS; i++) slots.push(i);
    return shuffle(slots).slice(0, count).sort((a, b) => a - b);
  }
  function randomType() {
    const r = Math.random();
    if (r < 0.45) return "battle";
    if (r < 0.58) return "elite";
    if (r < 0.74) return "event";
    if (r < 0.87) return "rest";
    if (r < 0.94) return "shop";
    return "chest";
  }
  function scaleMonster(base, mul) {
    return { name: base.name, emoji: base.emoji, hp: Math.round(base.hp * mul), attack: Math.round(base.attack * mul) };
  }
  function monsterFor(type, row) {
    if (type === "boss") return Object.assign({}, BOSS, { maxHp: BOSS.hp });
    if (type === "elite") {
      const base = pick(MONSTER_BASE);
      const m = scaleMonster(base, 1.6 + row * 0.12);
      m.name = "精英·" + base.name;
      return m;
    }
    // 普通战斗
    const names = BATTLE_POOL[Math.min(row - 1, BATTLE_POOL.length - 1)];
    const target = pick(names);
    const base = MONSTER_BASE.find((m) => m.name === target) || pick(MONSTER_BASE);
    return scaleMonster(base, 1 + (row - 1) * 0.25);
  }
  function connect(lower, upper) {
    lower.sort((a, b) => a.col - b.col);
    upper.sort((a, b) => a.col - b.col);
    // 每个上层节点至少一条入边（保证可达）
    upper.forEach((u) => {
      let best = lower[0], bd = Infinity;
      lower.forEach((l) => { const d = Math.abs(l.col - u.col); if (d < bd) { bd = d; best = l; } });
      if (best.edges.indexOf(u.id) < 0) best.edges.push(u.id);
    });
    // 每个下层节点至少一条出边
    lower.forEach((l) => {
      if (l.edges.length === 0) {
        const u = upper.reduce((a, b) => Math.abs(a.col - l.col) <= Math.abs(b.col - l.col) ? a : b);
        l.edges.push(u.id);
      }
    });
    // 追加少量连线，增加分支感（避免重复与交叉过度）
    lower.forEach((l) => {
      if (l.edges.length < 2 && Math.random() < 0.55) {
        let best = null, bd = Infinity;
        upper.forEach((u) => {
          if (l.edges.indexOf(u.id) >= 0) return;
          const d = Math.abs(l.col - u.col);
          if (d < bd) { bd = d; best = u; }
        });
        if (best) l.edges.push(best.id);
      }
    });
  }
  function generateMap() {
    const nodes = [];
    const byRow = [];
    const mk = (row, col, type) => {
      const node = { id: "n" + row + "-" + col, row: row, col: col, type: type, edges: [], done: false };
      if (type !== "start") node.monster = monsterFor(type, row);
      return node;
    };
    byRow.push([mk(0, 1, "start")]);                 // 起点（不占战斗）
    for (let row = 1; row < ROWS - 1; row++) {
      const count = randInt(2, 4);
      const cols = sampleCols(count);
      byRow.push(cols.map((c) => mk(row, c, randomType())));
    }
    byRow.push([{ id: "n" + (ROWS - 1) + "-1", row: ROWS - 1, col: 1, type: "boss", edges: [], done: false, monster: monsterFor("boss", ROWS - 1) }]);
    for (let row = 0; row < ROWS - 1; row++) connect(byRow[row], byRow[row + 1]);
    byRow.forEach((rowNodes) => rowNodes.forEach((n) => nodes.push(n)));
    nodes.forEach((n) => { if (n.monster) n.monster.maxHp = n.monster.maxHp || n.monster.hp; });
    return nodes;
  }

  // ------- 地图渲染 -------
  const NODE_ICON = { start: "🚩", battle: "⚔️", elite: "💀", event: "❓", rest: "🔥", shop: "🛒", chest: "📦", boss: "🐉" };
  function nodeX(col) { return ((col + 0.5) / SLOTS * 100) + "%"; }
  function nodeY(row) { return (TOP_PAD + (ROWS - 1 - row) * ROW_GAP + NODE_SIZE / 2) + "px"; }
  function renderMap() {
    const cur = state.map.find((n) => n.id === state.currentId);
    const reachable = cur ? cur.edges : [];

    // 连线
    let svg = "";
    state.map.forEach((n) => {

  // ------- 视图切换 -------
  function showView(view) {

  // ------- 节点进入 -------
  function enterNode(id) {
    if (busy || !state) return;
    const node = state.map.find((n) => n.id === id);
    if (!node) return;
    const cur = state.map.find((n) => n.id === state.currentId);
    if (cur && cur.edges.indexOf(id) < 0 && id !== state.currentId) return; // 不可达
    state.currentId = id;

    switch (node.type) {
      case "battle":
      case "elite":
      case "boss":
        goBattle(node);
        break;
      case "rest":
        openRest(node);
        break;
      case "event":
        openEvent(node);
        break;
      case "shop":
        openShop(node);
        break;
      case "chest":
        openChest(node);
        break;
      default:
        finishNode(node);
    }
  }

  function finishNode(node) {

  // ------- 战斗 -------

  function dieEls() { return el.dicePool.querySelectorAll(".die"); }

  function roll() {
    if (busy || !playerTurn || !state) return;
    if (state.dicePool.length === 0) { log("你没有骰子可以投掷。", "hit"); return; }

    busy = true;
    playerTurn = false;
    el.rollBtn.disabled = true;
    el.trinketBtn.disabled = true;
    playSound("roll");
    const dice = state.dicePool;

    const r1 = dice.map((d) => randInt(1, d.faces));
    const els = dieEls();

    els.forEach((e) => e.classList.remove("max"));
    els.forEach((e) => e.classList.add("rolling"));
    let ticks = 0;
    const timer = setInterval(() => {
      els.forEach((e) => {
        const faces = dice[Number(e.dataset.idx)].faces;
        e.querySelector(".value").textContent = String(randInt(1, faces));
      });
      ticks++;
      if (ticks >= 12) {
        clearInterval(timer);
        let anyMax = false;
        els.forEach((e, i) => {
          e.classList.remove("rolling");
          e.querySelector(".value").textContent = String(r1[i]);
          if (r1[i] === dice[i].faces) { e.classList.add("max"); anyMax = true; }
        });
        if (anyMax) playSound("max");
        let crit;
        if (state.forceCrit) { crit = true; state.forceCrit = false; }
        else crit = Math.random() < state.player.critRate;
        if (crit) rollRound2(r1); else finishRoll(r1, null);
      }
    }, 55);
  }

  function rollRound2(r1) {
    triggerCrit("暴击！");

    const dice = state.dicePool;
    const els = dieEls();
    const r2 = dice.map((d) => randInt(1, d.faces));

    els.forEach((e) => e.classList.remove("max"));
    els.forEach((e) => e.classList.add("rolling"));
    let ticks = 0;
    const timer = setInterval(() => {
      els.forEach((e) => {
        const i = Number(e.dataset.idx);
        const faces = dice[i].faces;
        e.querySelector(".value").textContent = String(r1[i] + randInt(1, faces));
      });
      ticks++;
      if (ticks >= 12) {
        clearInterval(timer);
        let anyMax = false;
        els.forEach((e, i) => {
          e.classList.remove("rolling");
          e.querySelector(".value").textContent = String(r1[i] + r2[i]);
          if (r2[i] === dice[i].faces) { e.classList.add("max"); anyMax = true; }
        });
        if (anyMax) playSound("max");
        finishRoll(r1, r2);
      }
    }, 55);
  }

  function finishRoll(r1, r2) {
    const dice = state.dicePool;
    let total;
    if (r2) {
      const s1 = r1.reduce((a, b) => a + b, 0);
      const s2 = r2.reduce((a, b) => a + b, 0);
      total = s1 + s2;
      log("第一轮 " + s1 + "，第二轮 " + s2 + "，合计 " + total + "。", "muted");
    } else {
      total = r1.reduce((a, b) => a + b, 0);
      const detail = dice.map((d, i) => "D" + d.faces + "=" + r1[i]).join("  ");
      log("你投掷了 " + dice.length + " 颗骰子：" + detail, "muted");
    }
    log("你对 " + state.monster.name + " 造成 " + total + " 点伤害！", "dmg");

    state.monster.hp -= total;
    playSound("hit");
    hitFlash(el.monsterPanel);
    renderHP("monster");

    if (state.monster.hp <= 0) {
      state.monster.hp = 0;
      renderHP("monster");
      endBattle(true);
      return;
    }
    setStatus("怪物回合", "monster");
    setTimeout(monsterAttack, 900);
  }

  function monsterAttack() {
    if (state.skipNextAttack) {
      state.skipNextAttack = false;
      log("⏳ 时光沙漏发动，怪物这次攻击被跳过了！", "hero");
      playerTurn = true;
      busy = false;
      updateTurnUI();
      return;
    }
    const dmg = state.monster.attack;
    log(state.monster.name + " 对你造成 " + dmg + " 点伤害！", "hit");
    state.player.hp -= dmg;
    playSound("hit");
    hitFlash(el.playerPanel);
    renderHP("player");
    if (state.player.hp <= 0) {
      state.player.hp = 0;
      renderHP("player");
      endBattle(false);
      return;
    }
    playerTurn = true;
    busy = false;
    updateTurnUI();
  }

  function endBattle(win) {
    busy = true;
    playerTurn = false;
    el.rollBtn.disabled = true;
    el.trinketBtn.disabled = true;
    if (win) {
      playSound("win");
      setStatus("🏆 胜利！", "win");
      el.rollBtn.textContent = "你击败了 " + state.monster.name;
      log("🏆 你击败了 " + state.monster.name + "！", "hero");
      const node = state.map.find((n) => n.id === state.currentId);
      setTimeout(function () { battleVictory(node); }, 600);
    } else {
      playSound("lose");
      setStatus("💀 战败…", "lose");
      log("💀 你被 " + state.monster.name + " 击败了……", "hit");
      setTimeout(loseGame, 900);
    }
  }

  function battleVictory(node) {
    if (node.type === "boss") { bossVictory(); return; }
    const base = node.type === "elite" ? 25 : 10;
    const goldGain = hasRelic("r_gold") ? Math.ceil(base * 1.5) : base;
    state.player.gold += goldGain;
    if (hasRelic("r_blood")) state.player.hp = Math.min(state.player.maxHp, state.player.hp + 5);

    const parts = [];
    parts.push("🪙 金币 +" + goldGain);
    if (node.type === "elite") {
      state.dicePool.push({ faces: 6 });
      parts.push("🎲 额外获得一颗 D6");
    }
    if (hasRelic("r_blood")) parts.push("🩸 血之渴望回复 5 生命");
    log("结算：" + parts.join(" · "), "hero");

    showRelicChoice(node, parts.join(" · "));
  }

  function bossVictory() {
    openNodeModal("🎉 通关！");
    const body = el.nodeModalBody;
    body.innerHTML = "";
    const tip = document.createElement("p");
    tip.className = "reward-tip";
    tip.textContent = "你击败了远古巨龙，登顶了骰子之塔！";
    body.appendChild(tip);
    const btn = mkBtn("🔄 重新开始", "btn-primary", function () { closeNodeModal(); restartGame(); });
    btn.style.width = "100%";
    body.appendChild(btn);
    el.nodeModal.classList.add("open");
  }

  function loseGame() {
    openNodeModal("💀 战败");
    const body = el.nodeModalBody;
    body.innerHTML = "";
    const tip = document.createElement("p");
    tip.className = "reward-tip";
    tip.textContent = "你倒在了第 " + (state.map.find((n) => n.id === state.currentId) || {}).row + " 层。重新规划路线再战！";
    body.appendChild(tip);
    const btn = mkBtn("🔄 重新开始", "btn-primary", function () { closeNodeModal(); restartGame(); });
    btn.style.width = "100%";
    body.appendChild(btn);
    el.nodeModal.classList.add("open");
  }

  // ------- 通用弹窗 -------
  function openNodeModal(title) { el.nodeModalTitle.textContent = title; }
  function closeNodeModal() { el.nodeModal.classList.remove("open"); }
  function mkBtn(text, cls, onClick) {
    const b = document.createElement("button");
    b.textContent = text;
    b.className = cls || "btn-primary";
    b.style.width = "100%";
    b.style.padding = "13px";
    b.style.borderRadius = "12px";
    b.style.fontSize = "15px";
    b.style.fontWeight = "700";
    b.style.border = "none";
    b.style.cursor = "pointer";
    b.onclick = onClick;
    return b;
  }

  // ------- 遗物三选一 -------
  function showRelicChoice(node, summary) {
    openNodeModal("🏆 战利品 · " + summary);
    const body = el.nodeModalBody;
    body.innerHTML = "";
    const tip = document.createElement("p");
    tip.className = "reward-tip";
    tip.textContent = "选择一项遗物（被动）成长：";
    body.appendChild(tip);

    const grid = document.createElement("div");
    grid.className = "reward-grid";
    const options = shuffle(RELICS).slice(0, 3);
    options.forEach((r) => {
      const card = document.createElement("button");
      card.className = "reward-card";
      const ico = document.createElement("span");
      ico.className = "ico";
      ico.textContent = r.ico;
      const txtWrap = document.createElement("span");
      txtWrap.innerHTML = '<span class="txt">' + r.name + '</span><br><span class="desc">' + r.desc + '</span>';
      card.appendChild(ico);
      card.appendChild(txtWrap);
      card.onclick = function () {
        applyRelic(r);
        closeNodeModal();
        finishNode(node);
      };
      grid.appendChild(card);
    });
    body.appendChild(grid);
    el.nodeModal.classList.add("open");
  }

  function applyRelic(r) {
    state.relics.push(r);
    let msg = "获得遗物【" + r.name + "】";
    if (r.id === "r_hp") { state.player.maxHp += 15; state.player.hp += 15; msg += "：生命上限 +15。"; }
    else if (r.id === "r_crit") { state.player.critRate = Math.min(CRIT_CAP, state.player.critRate + 0.08); msg += "：暴击率 +8%（现 " + critPct() + "%）。"; }
    else if (r.id === "r_d6") { state.dicePool.push({ faces: 6 }); msg += "：获得一颗 D6。"; }
    else if (r.id === "r_upgrade") { upgradeMinDice(); msg += "：最低面骰子升一级。"; }
    else if (r.id === "r_blood") { msg += "：战斗胜利将回复生命。"; }
    else if (r.id === "r_gold") { msg += "：金币获取提升。"; }
    log(msg, "hero");
  }

  function upgradeMinDice() {
    const sorted = state.dicePool.slice().sort((a, b) => a.faces - b.faces);
    const min = sorted[0];
    if (!min) { state.dicePool.push({ faces: 6 }); return; }
    const idx = DICE_UPGRADE.indexOf(min.faces);
    if (idx < DICE_UPGRADE.length - 1) min.faces = DICE_UPGRADE[idx + 1];
    else state.dicePool.push({ faces: 20 });
  }

  // ------- 饰品 -------
  function applyTrinket(t) {
    const old = state.trinket;
    state.trinket = t;
    const msg = "获得饰品【" + t.name + "】" + (old ? "（替换了 " + old.name + "）" : "");
    log(msg, "hero");
  }
  function updateTrinketUI() {
    if (!state || !state.trinket) { el.trinketBtn.style.display = "none"; return; }
    el.trinketBtn.style.display = "block";
    el.trinketBtn.textContent = state.trinket.ico + " " + state.trinket.name + (state.trinketUsed ? "（已用）" : "（使用）");
    el.trinketBtn.disabled = state.trinketUsed || !playerTurn || busy;
  }
  function useTrinket() {
    if (!state.trinket || state.trinketUsed || busy || !playerTurn) return;
    const t = state.trinket;
    state.trinketUsed = true;
    if (t.id === "t_shield") { state.player.hp = Math.min(state.player.maxHp, state.player.hp + 15); log("🛡️ 铁壁护盾：回复 15 生命。", "hero"); renderHP("player"); }
    else if (t.id === "t_hour") { state.skipNextAttack = true; log("⏳ 时光沙漏：下次怪物攻击将被跳过。", "hero"); }
    else if (t.id === "t_crit") { state.forceCrit = true; log("💥 必杀符：下次投掷必定暴击。", "hero"); }
    else if (t.id === "t_heal") { state.player.hp = Math.min(state.player.maxHp, state.player.hp + 30); log("🌿 回春之种：回复 30 生命。", "hero"); renderHP("player"); }
    playSound("win");
    updateTrinketUI();
  }

  // ------- 节点内容：休息 / 事件 / 商店 / 宝箱 -------
  function openRest(node) {
    const heal = Math.round(state.player.maxHp * 0.3);
    state.player.hp = Math.min(state.player.maxHp, state.player.hp + heal);
    openNodeModal("🔥 篝火休息");
    const body = el.nodeModalBody;
    body.innerHTML = "";
    const tip = document.createElement("p");
    tip.className = "reward-tip";
    tip.textContent = "你燃起篝火，回复了 " + heal + " 生命（现 " + state.player.hp + "/" + state.player.maxHp + "）。";
    body.appendChild(tip);

    const actions = document.createElement("div");
    actions.className = "modal-actions";
    const buyFull = mkBtn("付费回满（30 金币）", "btn-ghost", function () {
      if (state.player.gold < 30) { alert("金币不足"); return; }
      state.player.gold -= 30;
      state.player.hp = state.player.maxHp;
      closeNodeModal();
      finishNode(node);
    });
    if (state.player.gold < 30 || state.player.hp >= state.player.maxHp) buyFull.disabled = true;
    const go = mkBtn("继续前进", "btn-primary", function () { closeNodeModal(); finishNode(node); });
    actions.appendChild(buyFull);
    actions.appendChild(go);
    body.appendChild(actions);
    el.nodeModal.classList.add("open");
  }

  function openEvent(node) {
    const ev = pick(EVENTS);
    openNodeModal(ev.ico + " " + ev.name);
    const body = el.nodeModalBody;
    body.innerHTML = "";
    const tip = document.createElement("p");
    tip.className = "reward-tip";
    tip.textContent = ev.text;
    body.appendChild(tip);
    const actions = document.createElement("div");
    actions.className = "modal-actions";

    if (ev.id === "shrine") {
      const a = mkBtn("献上 20 金币（生命上限+10）", "btn-primary", function () {
        if (state.player.gold < 20) { alert("金币不足"); return; }
        state.player.gold -= 20;
        state.player.maxHp += 10; state.player.hp += 10;
        log("🕯️ 祭坛赐福：生命上限 +10。", "hero");
        closeNodeModal(); finishNode(node);
      });
      if (state.player.gold < 20) a.disabled = true;
      const b = mkBtn("离开", "btn-ghost", function () { closeNodeModal(); finishNode(node); });
      actions.appendChild(a); actions.appendChild(b);
    } else if (ev.id === "gamble") {
      const a = mkBtn("押上生命赌一把", "btn-primary", function () {
        const rollv = randInt(1, 6);
        if (rollv >= 4) { const g = 30; state.player.gold += g; log("🎰 押中 " + rollv + " 点，获得 " + g + " 金币！", "hero"); }
        else { state.player.hp = Math.max(1, state.player.hp - 10); log("🎰 押中 " + rollv + " 点，损失 10 生命。", "hit"); }
        closeNodeModal(); finishNode(node);
      });
      const b = mkBtn("离开", "btn-ghost", function () { closeNodeModal(); finishNode(node); });
      actions.appendChild(a); actions.appendChild(b);
    } else if (ev.id === "cauldron") {
      const a = mkBtn("献出最低面骰子（+15 金币）", "btn-primary", function () {
        const sorted = state.dicePool.slice().sort((x, y) => x.faces - y.faces);
        if (sorted.length < 2) { alert("至少保留一颗骰子才能献出"); return; }
        const min = sorted[0];
        state.dicePool.splice(state.dicePool.indexOf(min), 1);
        state.player.gold += 15;
        log("🧪 炼金釜炼化了一颗 D" + min.faces + "，获得 15 金币。", "hero");
        closeNodeModal(); finishNode(node);
      });
      const b = mkBtn("离开", "btn-ghost", function () { closeNodeModal(); finishNode(node); });
      actions.appendChild(a); actions.appendChild(b);
    }
    body.appendChild(actions);
    el.nodeModal.classList.add("open");
  }

  function openShop(node) {
    openNodeModal("🛒 商店");
    const body = el.nodeModalBody;
    body.innerHTML = "";
    const tip = document.createElement("p");
    tip.className = "reward-tip";
    tip.textContent = "当前金币：🪙 " + state.player.gold;
    body.appendChild(tip);

    const items = shuffle([
      { ico: "🎲", name: "D12 骰子", desc: "获得一颗 D12", price: 40, buy: function () { state.dicePool.push({ faces: 12 }); log("🛒 购买了 D12 骰子。", "hero"); } },
      { ico: "❤️", name: "回满生命", desc: "完全回复生命值", price: 35, buy: function () { state.player.hp = state.player.maxHp; log("🛒 购买生命回复，生命已回满。", "hero"); } },
      { ico: "🧿", name: "随机遗物", desc: "随机获得一个遗物", price: 70, buy: function () { applyRelic(pick(RELICS)); } },
      { ico: "📿", name: "随机饰品", desc: "随机获得一个饰品", price: 60, buy: function () { applyTrinket(pick(TRINKETS)); } }
    ]).slice(0, 3);

    items.forEach((it) => {
      const row = document.createElement("div");
      row.className = "shop-item";
      row.innerHTML = '<span class="ico">' + it.ico + '</span><span class="info"><span class="nm">' + it.name + '</span><br><span class="ds">' + it.desc + '</span></span>';
      const buy = document.createElement("button");
      buy.className = "buy-btn";
      buy.textContent = "🪙 " + it.price;
      buy.onclick = function () {
        if (state.player.gold < it.price) return;
        state.player.gold -= it.price;
        it.buy();
        buy.disabled = true;
        buy.textContent = "已购买";
        tip.textContent = "当前金币：🪙 " + state.player.gold;
      };
      row.appendChild(buy);
      body.appendChild(row);
    });

    const actions = document.createElement("div");
    actions.className = "modal-actions";
    const go = mkBtn("离开商店", "btn-primary", function () { closeNodeModal(); finishNode(node); });
    actions.appendChild(go);
    body.appendChild(actions);
    el.nodeModal.classList.add("open");
  }

  function openChest(node) {
    const rollv = Math.random();
    let txt, apply;
    if (rollv < 0.3) { const g = randInt(15, 30); state.player.gold += g; txt = "🪙 获得 " + g + " 金币！"; }
    else if (rollv < 0.5) { const f = pick([6, 6, 12]); state.dicePool.push({ faces: f }); txt = "🎲 获得一颗 D" + f + "！"; }
    else if (rollv < 0.75) { const r = pick(RELICS); applyRelic(r); txt = "🧿 获得遗物【" + r.name + "】！"; }
    else { const t = pick(TRINKETS); applyTrinket(t); txt = "📿 获得饰品【" + t.name + "】！"; }

    openNodeModal("📦 宝箱");
    const body = el.nodeModalBody;
    body.innerHTML = "";
    const tip = document.createElement("p");
    tip.className = "reward-tip";
    tip.textContent = "你打开了宝箱……" + txt;
    body.appendChild(tip);
    const btn = mkBtn("继续前进", "btn-primary", function () { closeNodeModal(); finishNode(node); });
    body.appendChild(btn);
    el.nodeModal.classList.add("open");
    playSound("win");
  }

  // ------- 设置面板 -------
  function openModal() {
    $("pName").value = config.player.name;
    $("pHp").value = config.player.hp;
    $("pCrit").value = Math.round(config.player.critRate * 100);
    $("pGold").value = config.player.gold;
    $("pD4").value = config.player.dice[4];
    $("pD6").value = config.player.dice[6];
    $("pD12").value = config.player.dice[12];
    $("pD20").value = config.player.dice[20];
    el.configModal.classList.add("open");
  }
  function closeModal() { el.configModal.classList.remove("open"); }

  function applyConfig() {
    const pName = $("pName").value.trim() || "玩家";
    const pHp = parseInt($("pHp").value, 10);
    const crit = parseInt($("pCrit").value, 10);
    const gold = parseInt($("pGold").value, 10);
    const d4 = parseInt($("pD4").value, 10);
    const d6 = parseInt($("pD6").value, 10);
    const d12 = parseInt($("pD12").value, 10);
    const d20 = parseInt($("pD20").value, 10);

    if (!(pHp > 0)) { alert("玩家生命值需大于 0"); return; }
    if (!(crit >= 0 && crit <= 100)) { alert("暴击率需在 0~100 之间（游戏中成长上限 60%）"); return; }
    const totalDice = [d4, d6, d12, d20].reduce((a, b) => a + (Number.isFinite(b) ? b : 0), 0);
    if (totalDice <= 0) { alert("至少需要一颗骰子"); return; }

    config.player = { name: pName, hp: pHp, critRate: Math.min(CRIT_CAP, crit / 100), gold: Number.isFinite(gold) && gold >= 0 ? gold : 15, dice: { 4: d4, 6: d6, 12: d12, 20: d20 } };
    closeModal();
    restartGame();
  }

  // ------- 事件 -------
  el.rollBtn.addEventListener("click", function () {
    if (state && state.player.hp <= 0) { restartGame(); return; }
    roll();
  });
  el.trinketBtn.addEventListener("click", useTrinket);
  el.configToggle.addEventListener("click", openModal);
  el.restartBtn.addEventListener("click", function () {
    if (confirm("确定重新开始？当前进度会清空。")) restartGame();
  });
  el.cancelBtn.addEventListener("click", closeModal);
  el.applyBtn.addEventListener("click", applyConfig);
  el.configModal.addEventListener("click", (e) => { if (e.target === el.configModal) closeModal(); });

  // ------- 启动 -------
  restartGame();
})();
</script>
</body>
</html>
